<!DOCTYPE html>
<html>
<head>
    <title>Delete Employee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff3f3;
            margin: 20px;
        }

        .container {
            background: white;
            padding: 20px;
            border: 1px solid #ffcccc;
            border-radius: 8px;
            max-width: 400px;
        }

        h2 {
            color: #cc0000;
        }

        p {
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
        }

        a {
            margin-left: 10px;
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Confirm Delete</h2>
        <p>Are you sure you want to delete <strong>{{ employee.name }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Yes, Delete</button>
            <a href="{% url 'employee_list' %}">Cancel</a>
        </form>
    </div>
</body>
</html>
